# earth
earth_rotation_speed: 7.2921151467e-05 # rad/s
earth_gravity: 0
# reference point
ref_longitude: 120.401989
ref_latitude: 31.508183
ref_altitude: 0.0

# kalman prediction process std
position_error_prior_std: 1.0e-3
velocity_error_prior_std: 1.0e-3
rotation_error_prior_std: 1.0e-3
gyro_bias_error_prior_std: 1.0e-3
accelerometer_bias_error_prior_std: 1.0e-3

# imu sensor noise
gyro_noise_std: 1.0e-2
accelerometer_noise_std: 1.0e-2

# kalman measurement process std (uint: m)
gps_position_x_std: 0.0001
gps_position_y_std: 0.0001
gps_position_z_std: 0.001

gnss_vel_x_std: 0.001
gnss_vel_y_std: 0.001
gnss_vel_z_std: 0.001

gnss_q_x_std: 0.001
gnss_q_y_std: 0.001
gnss_q_z_std: 0.001

lidar_position_x_std: 0.001
lidar_position_y_std: 0.001
lidar_position_z_std: 0.001
lidar_q_x_std: 0.001
lidar_q_y_std: 0.001
lidar_q_z_std: 0.001

# kalman measurement process std (uint: m/s)
vel_x_std: 0.0001
vel_y_std: 0.0001
vel_z_std: 0.001

# only use prediction, equivalent to only using IMU to integration
only_prediction: true

# use earth model
use_earth_model: false
