# 指定dbc文件，这里以lincoln.dbc为例，注意这里需要指定到文件在apollo容器内的绝对路径
# 默认把dbc放入在 /apollo_workspace/output/ 文件夹下
dbc_file: /apollo/modules/tools/gen_vehicle_protocol/yutong.dbc
# 定义dbc转换成yml文件名称
protocol_conf: /apollo/modules/tools/gen_vehicle_protocol/yutong.yml
# 定义车型名称，根据车型自定义
car_type: yutong
# 定义控制报文协议列表，一般为空
sender_list: [cff272d, cffd12a, 18fe412a, 18fefa2d, 18ff422a, 18ffda2a]
# 自动驾驶模块在dbc中的ECU网络node名称，lincoln.dbc内定义的node名称为MAB
sender: VCU
# 定义哪些信号ID不需要生成，一般为空
black_list: [DF205F6, 18FDCD2A, 18FF452A, CFF5182, CFF5183, 18FEAD0B, 18FEBF0B, 18FEC117, 18FF0F24, 18FF1724, 18FF2DF3, 18FF32F4, 18FFC017, 18FFCC17, 18FFE117, 19FFCB24]
# 是否基于apollo_demo.dbc生成车型适配代码，现在dbc使用的是lincoln.dbc，false为否
use_demo_dbc: false

# 定义dbc转换成代码的生成文件夹，默认如下文件夹即可
#output_dir: /apollo/modules/canbus_vehicle
output_dir: /apollo/modules/tools/gen_vehicle_protocol/output
# 定义新车型所对应的canbus配置文件，默认如下文件夹即可
output_canbus_conf_dir: /apollo/modules/canbus/output
