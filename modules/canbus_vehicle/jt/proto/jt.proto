syntax = "proto2";

package apollo.canbus;

message Acu1_151 {
// Control Message
  enum Acu1_steeringcontrolflagType {
    ACU1_STEERINGCONTROLFLAG_NO_REQUEST = 0;
    ACU1_STEERINGCONTROLFLAG_REQUEST = 1;
    ACU1_STEERINGCONTROLFLAG_RESERVED = 2;
  }
  // This signal is steering torque request [Nm] [-20|20]
  optional double acu1_steeringtargettorque = 1;
  // This signal is steering speed request [deg/s] [0|500]
  optional int32 acu1_steeringtargetspeed = 2;
  // This signal is the status of steering control request [] [0|3]
  optional Acu1_steeringcontrolflagType acu1_steeringcontrolflag = 3;
  // This signal is steering angle request [deg] [-600|600]
  optional double acu1_steeringtargetangle = 4;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 acu1_livecounter = 5;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 acu1_checksum = 6;
}

message Acu2_152 {
// Control Message
  enum Acu2_drivingcontrolflagType {
    ACU2_DRIVINGCONTROLFLAG_NO_REQUEST = 0;
    ACU2_DRIVINGCONTROLFLAG_REQUESTTHROTTLE = 1;
    ACU2_DRIVINGCONTROLFLAG_RESERVEDSPEED = 2;
    ACU2_DRIVINGCONTROLFLAG_RESERVED = 3;
  }
  // [km/h] [0|126]
  optional double acu2_drivingtargetspeed = 1;
  // This signal is acceleration pedal position request [Nm] [0|350]
  optional double acu2_drivingtargettorque = 2;
  // This signal is acceleration pedal position request [%] [0|100]
  optional double acu2_drivingtargetthrottle = 3;
  // This signal is the status of the driving control request [] [0|3]
  optional Acu2_drivingcontrolflagType acu2_drivingcontrolflag = 4;
  // This signal is acceleration pedal position request [m/s2] [0|10]
  optional double acu2_drivingtargetacceleration = 5;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 acu2_livecounter = 6;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 acu2_checksum = 7;
}

message Acu3_153 {
// Control Message
  enum Acu3_epbcontrolflagType {
    ACU3_EPBCONTROLFLAG_NO_REQUEST = 0;
    ACU3_EPBCONTROLFLAG_RELEASE = 1;
    ACU3_EPBCONTROLFLAG_LOCK = 2;
    ACU3_EPBCONTROLFLAG_RESERVED = 3;
  }
  enum Acu3_geartargetType {
    ACU3_GEARTARGET_P = 0;
    ACU3_GEARTARGET_R = 1;
    ACU3_GEARTARGET_N = 2;
    ACU3_GEARTARGET_D = 3;
    ACU3_GEARTARGET_RESERVED = 4;
  }
  enum Acu3_gearcontrolflagType {
    ACU3_GEARCONTROLFLAG_NO_REQUEST = 0;
    ACU3_GEARCONTROLFLAG_REQUEST = 1;
  }
  enum Acu3_brakingcontrolflagType {
    ACU3_BRAKINGCONTROLFLAG_NO_REQUEST = 0;
    ACU3_BRAKINGCONTROLFLAG_REQUEST_PRESURE = 1;
    ACU3_BRAKINGCONTROLFLAG_REQUEST_DEC = 2;
    ACU3_BRAKINGCONTROLFLAG_REQUEST_POSITION = 3;
  }
  // [%] [0|100]
  optional double acu3_brakingtargetposition = 1;
  // This signal is the status of the braking control request [] [0|3]
  optional Acu3_epbcontrolflagType acu3_epbcontrolflag = 2;
  // This signal is gear request [] [0|7]
  optional Acu3_geartargetType acu3_geartarget = 3;
  // This signal is the status of the gear control request [] [0|1]
  optional Acu3_gearcontrolflagType acu3_gearcontrolflag = 4;
  // This signal is deceleration request for wheel brake [Mpa] [0|10]
  optional double acu3_brakingtargetpressure = 5;
  // This signal is deceleration request for wheel brake [m/s2] [-10|0]
  optional double acu3_brakingtargetdeceleration = 6;
  // This signal is the status of the braking control request [] [0|3]
  optional Acu3_brakingcontrolflagType acu3_brakingcontrolflag = 7;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 acu3_livecounter = 8;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 acu3_checksum = 9;
}

message Acu4_154 {
// Control Message
  enum Acu4_steeringlamprequestType {
    ACU4_STEERINGLAMPREQUEST_OFF = 0;
    ACU4_STEERINGLAMPREQUEST_LEFT_ON = 1;
    ACU4_STEERINGLAMPREQUEST_RIGHT_ON = 2;
    ACU4_STEERINGLAMPREQUEST_RESERVED = 3;
  }
  enum Acu4_hazardlamprequestType {
    ACU4_HAZARDLAMPREQUEST_OFF = 0;
    ACU4_HAZARDLAMPREQUEST_ON = 1;
  }
  // 1power on 3power off [] [0|3]
  optional int32 acu4_powerrequest = 1;
  // 1fall  2 rise 3 stop [] [0|0]
  optional int32 acu4_rrwindow_request = 2;
  // 1fall  2 rise 3 stop [] [0|0]
  optional int32 acu4_rlwindow_request = 3;
  // 1lock 2unlock [] [0|0]
  optional int32 acu4_lock_request = 4;
  // 1fall  2 rise 3 stop [] [0|0]
  optional int32 acu4_frwindow_request = 5;
  // 1fall  2 rise 3 stop [] [0|0]
  optional int32 acu4_flwindow_request = 6;
  // 1on 2 off 3stop [] [0|0]
  optional int32 acu4_boot_request = 7;
  // [] [0|3]
  optional int32 acu4_rearwiperrequest = 8;
  // [] [0|1]
  optional bool acu4_led4request = 9;
  // [] [0|1]
  optional bool acu4_led3request = 10;
  // [] [0|1]
  optional bool acu4_led2request = 11;
  // [] [0|1]
  optional bool acu4_led1request = 12;
  // This signal is the the horn lamp or request [] [0|1]
  optional bool acu4_lamphorn = 13;
  // 0off  1:on [] [0|3]
  optional int32 acu4_whistlerequest = 14;
  // 0stop 1inject water 2slow 3fast [] [0|3]
  optional int32 acu4_frontwiperrequest = 15;
  // 0:OFF 1:LOW 2£ºHIGH [] [0|3]
  optional int32 acu4_beamlamprequest = 16;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 acu4_livecounter = 17;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 acu4_checksum = 18;
  // This signal is steering light request [] [0|3]
  optional Acu4_steeringlamprequestType acu4_steeringlamprequest = 19;
  // This signal is hazard light request [] [0|1]
  optional Acu4_hazardlamprequestType acu4_hazardlamprequest = 20;
}

message Acs1_20c {
// Report Message
  enum Acs1_drivingstatemachineType {
    ACS1_DRIVINGSTATEMACHINE_IDLE = 0;
    ACS1_DRIVINGSTATEMACHINE_CHECK = 1;
    ACS1_DRIVINGSTATEMACHINE_MANUAL = 2;
    ACS1_DRIVINGSTATEMACHINE_REMOTE = 3;
    ACS1_DRIVINGSTATEMACHINE_IPC = 4;
    ACS1_DRIVINGSTATEMACHINE_INTERVENTION = 5;
    ACS1_DRIVINGSTATEMACHINE_EMERGENCY = 6;
    ACS1_DRIVINGSTATEMACHINE_ERROR = 7;
  }
  enum Acs1_geartakeoverstType {
    ACS1_GEARTAKEOVERST_INACTIVE = 0;
    ACS1_GEARTAKEOVERST_TEMP_ACTIVE = 1;
    ACS1_GEARTAKEOVERST_ACTIVE = 2;
    ACS1_GEARTAKEOVERST_RESERVED = 3;
  }
  enum Acs1_gearfailurestType {
    ACS1_GEARFAILUREST_NO_FAIL = 0;
    ACS1_GEARFAILUREST_EGSM_FAIL = 1;
    ACS1_GEARFAILUREST_HCU_FAIL = 2;
    ACS1_GEARFAILUREST_RESERVED = 3;
  }
  enum Acs1_gearautocontrolstType {
    ACS1_GEARAUTOCONTROLST_INACTIVE = 0;
    ACS1_GEARAUTOCONTROLST_ACTIVE = 1;
    ACS1_GEARAUTOCONTROLST_RESERVED = 2;
  }
  enum Acs1_steeringtakeoverstType {
    ACS1_STEERINGTAKEOVERST_INACTIVE = 0;
    ACS1_STEERINGTAKEOVERST_TEMP_ACTIVE = 1;
    ACS1_STEERINGTAKEOVERST_ACTIVE = 2;
    ACS1_STEERINGTAKEOVERST_RESERVED = 3;
  }
  enum Acs1_steeringfailurestType {
    ACS1_STEERINGFAILUREST_NO_FAIL = 0;
    ACS1_STEERINGFAILUREST_EPS_FAIL = 1;
    ACS1_STEERINGFAILUREST_SAS_FAIL = 2;
    ACS1_STEERINGFAILUREST_APA_FAIL = 3;
  }
  enum Acs1_steeringautocontrolstType {
    ACS1_STEERINGAUTOCONTROLST_INACTIVE = 0;
    ACS1_STEERINGAUTOCONTROLST_ACTIVE = 1;
    ACS1_STEERINGAUTOCONTROLST_RESERVED = 2;
  }
  enum Acs1_drivingtakeoverstType {
    ACS1_DRIVINGTAKEOVERST_INACTIVE = 0;
    ACS1_DRIVINGTAKEOVERST_TEMP_ACTIVE = 1;
    ACS1_DRIVINGTAKEOVERST_ACTIVE = 2;
    ACS1_DRIVINGTAKEOVERST_RESERVED = 3;
  }
  enum Acs1_drivingfailurestType {
    ACS1_DRIVINGFAILUREST_NO_FAIL = 0;
    ACS1_DRIVINGFAILUREST_HCU_FAIL = 1;
    ACS1_DRIVINGFAILUREST_RESERVED = 2;
  }
  enum Acs1_drivingautocontrolstType {
    ACS1_DRIVINGAUTOCONTROLST_INACTIVE = 0;
    ACS1_DRIVINGAUTOCONTROLST_ACTIVE = 1;
    ACS1_DRIVINGAUTOCONTROLST_RESERVED = 2;
  }
  enum Acs1_brakingtakeoverstType {
    ACS1_BRAKINGTAKEOVERST_INACTIVE = 0;
    ACS1_BRAKINGTAKEOVERST_TEMP_ACTIVE = 1;
    ACS1_BRAKINGTAKEOVERST_ACTIVE = 2;
    ACS1_BRAKINGTAKEOVERST_RESERVED = 3;
  }
  enum Acs1_brakingfailurestType {
    ACS1_BRAKINGFAILUREST_NO_FAIL = 0;
    ACS1_BRAKINGFAILUREST_ESP_FAIL = 1;
    ACS1_BRAKINGFAILUREST_SS_FAIL = 2;
    ACS1_BRAKINGFAILUREST_HCU_FAIL = 3;
  }
  enum Acs1_brakingautocontrolstType {
    ACS1_BRAKINGAUTOCONTROLST_INACTIVE = 0;
    ACS1_BRAKINGAUTOCONTROLST_ACTIVE = 1;
    ACS1_BRAKINGAUTOCONTROLST_RESERVED = 2;
  }
  // [] [0|3]
  optional int32 acs1_workmode = 1;
  // This signal indicates the state machine of steering. [value] [0|15]
  optional int32 acs1_steeringstatemachine = 2;
  // This signal indicates the state machine of gear. [value] [0|15]
  optional int32 acs1_gearstatemachine = 3;
  // This signal indicates the state machine of driving. [value] [0|15]
  optional Acs1_drivingstatemachineType acs1_drivingstatemachine = 4;
  // This signal indicates the state machine of braking. [value] [0|15]
  optional int32 acs1_brakingstatemachine = 5;
  // This signal indicates the gear is under maunal taking over. [] [0|3]
  optional Acs1_geartakeoverstType acs1_geartakeoverst = 6;
  // This signal indicates the gear is in fault status [] [0|3]
  optional Acs1_gearfailurestType acs1_gearfailurest = 7;
  // This signal indicates the gear is under automatical control or not. [] [0|3]
  optional Acs1_gearautocontrolstType acs1_gearautocontrolst = 8;
  // This signal indicates the steering is under maunal taking over. [] [0|3]
  optional Acs1_steeringtakeoverstType acs1_steeringtakeoverst = 9;
  // This signal indicates the steering is in fault status [] [0|3]
  optional Acs1_steeringfailurestType acs1_steeringfailurest = 10;
  // This signal indicates the steering is under automatical control or not. [] [0|3]
  optional Acs1_steeringautocontrolstType acs1_steeringautocontrolst = 11;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 acs1_livecounter = 12;
  // This signal indicates the driving is under maunal taking over. [] [0|3]
  optional Acs1_drivingtakeoverstType acs1_drivingtakeoverst = 13;
  // This signal indicates the driving is in fault status [] [0|3]
  optional Acs1_drivingfailurestType acs1_drivingfailurest = 14;
  // This signal indicates the driving is under automatical control or not. [] [0|3]
  optional Acs1_drivingautocontrolstType acs1_drivingautocontrolst = 15;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 acs1_checksum = 16;
  // This signal indicates the braking is under maunal taking over. [] [0|3]
  optional Acs1_brakingtakeoverstType acs1_brakingtakeoverst = 17;
  // This signal indicates the braking is in fault status [] [0|3]
  optional Acs1_brakingfailurestType acs1_brakingfailurest = 18;
  // This signal indicates the braking is under automatical control or not. [] [0|3]
  optional Acs1_brakingautocontrolstType acs1_brakingautocontrolst = 19;
}

