message Vcu1_210 {
// Report Message
  // The signal indicates the actual applied overlay toque in EPS. [Nm] [-10|10]
  optional double vcu1_overlayinputtorque = 1;
  // The signal indicates the torque measured by the torque sensor at the steering wheel [Nm] [-10|10]
  optional double vcu1_handsteeringtorque = 2;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 vcu1_livecounter = 3;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 vcu1_checksum = 4;
  // This signal indicates the teering wheel rotation speed. anticlockwise=negative, clockwise=positive [deg/s] [-600|600]
  optional double vcu1_steeringspeed = 5;
  // This signal indicates the angle of steering wheel. anticlockwise=negative, clockwise=positive [deg] [-600|600]
  optional double vcu1_steeringangle = 6;
}

message Vcu2_211 {
// Report Message
  enum Vcu2_brakepedalstType {
    VCU2_BRAKEPEDALST_NO_ACTUATED = 0;
    VCU2_BRAKEPEDALST_ACTUATED = 1;
    VCU2_BRAKEPEDALST_RESERVED = 2;
    VCU2_BRAKEPEDALST_ERROR = 3;
  }
  enum Vcu2_drivingdirectionType {
    VCU2_DRIVINGDIRECTION_STOP = 0;
    VCU2_DRIVINGDIRECTION_FORWARD = 1;
    VCU2_DRIVINGDIRECTION_BACKWARD = 2;
    VCU2_DRIVINGDIRECTION_INVALID_VALUE = 3;
  }
  // The signal indicates the actual pressure in the master cylinder. [bar] [0|200]
  optional double vcu2_mastercylinderpressure = 1;
  // This signal indicates the brake pedal status. [] [0|3]
  optional Vcu2_brakepedalstType vcu2_brakepedalst = 2;
  // The signal describes the raw vehicle speed calculated by ABS. [km/h] [0|300]
  optional double vcu2_vehiclespeed = 3;
  // The signal indicates driving direction of the vehicle. [] [0|3]
  optional Vcu2_drivingdirectionType vcu2_drivingdirection = 4;
  // This signal indicates the calculated acceleration pedal position in cruise control mode. [%] [0|100]
  optional double vcu2_calaccelerationpedalpositio = 5;
  // This signal indicates the actual acceleration pedal position [%] [0|100]
  optional double vcu2_accelpedalposition = 6;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 vcu2_livecounter = 7;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 vcu2_checksum = 8;
}

