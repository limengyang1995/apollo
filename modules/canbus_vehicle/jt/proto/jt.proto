  // The signal indicates if decrease distance switch is actived or not [] [0|1]
  optional Vcu3_decreasedistanceswitchType vcu3_decreasedistanceswitch = 6;
  // The signal indicates if the cancel cruise control switch is actived or not [] [0|1]
  optional Vcu3_cancelswitchType vcu3_cancelswitch = 7;
  // This signal indicate the security button in the knob is pressed or not. [] [0|1]
  optional Vcu3_gearsecuritybuttonType vcu3_gearsecuritybutton = 8;
  // This signal indicate the park button in the knob is pressed or not. [] [0|1]
  optional Vcu3_gearparkbuttonType vcu3_gearparkbutton = 9;
  // This signal indicate the current lever position. [] [0|7]
  optional Vcu3_gearleverpositionType vcu3_gearleverposition = 10;
  // This signal indicate the EPB switch status. [] [0|3]
  optional Vcu3_epbswitchType vcu3_epbswitch = 11;
  // [kPa] [-108|96.6]
  optional double vcu3_vacuumpressure = 12;
  // The Livecounter is used to check the signal consistency of the messages [count] [0|15]
  optional int32 vcu3_livecounter = 13;
  // This signal indicates the lever position information which should be displayed on the dashboard. For H72G, only P,R,N,D,M,no connection. [] [0|15]
  optional Vcu3_leverinfoType vcu3_leverinfo = 14;
  // The signal indicates the working status of EPB. [] [0|3]
  optional Vcu3_epbstatusType vcu3_epbstatus = 15;
  // The checksum is used to check whether the data transmission errors [check] [0|255]
  optional int32 vcu3_checksum = 16;
  // The signal indicates to the actual gear status, it shows in which gear the transmission system is in at the moment (engaged gear). [] [0|15]
  optional Vcu3_actualgearType vcu3_actualgear = 17;
}

message Epb1_2a1 {
// Report Message
  // The Livecounter is used to check the signal consistency of the messages [] [0|0]
  optional int32 epb1_livecounter = 1;
  // 0:no request 1: lock 2 :release 3: reserved [] [0|0]
  optional int32 epb1_epbswitch = 2;
  // 0: released 1: locked 2: releasing 3:locking [] [0|0]
  optional int32 epb1_epbstatus = 3;
  // [] [0|0]
  optional int32 epb1_checksum = 4;
}

message Jt {
  optional Acu1_151 acu1_151 = 1; // control message
  optional Acu2_152 acu2_152 = 2; // control message
  optional Acu3_153 acu3_153 = 3; // control message
  optional Acu4_154 acu4_154 = 4; // control message
  optional Acs1_20c acs1_20c = 5; // report message
  optional Acs2_20d acs2_20d = 6; // report message
  optional Acs3_20e acs3_20e = 7; // report message
  optional Vcu1_210 vcu1_210 = 8; // report message
  optional Vcu2_211 vcu2_211 = 9; // report message
  optional Vcu3_212 vcu3_212 = 10; // report message
  optional Epb1_2a1 epb1_2a1 = 11; // report message
}
